driver:
  name: docker
  use_sudo: false
  privileged: true

provisioner:
  name: salt_solo
  salt_install: none
  formula: k0s

platforms:
  - name: ubuntu
    driver_config:
      image: salt-kitchen:ubuntu-22.04

verifier:
  name: shell

suites:
  - name: default
    verifier:
      command: .venv/bin/pytest tests/integration/default/ -v --html=reports/report-default.html
    provisioner:
      pillars: {}
      pillars_from_files:
        base.sls: pillars/base.sls
      state_top:
        base:
          "*":
            - k0s